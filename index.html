<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>zero CODEX - Free Script, ZeroTwo AI, Open Project</title>

<!-- Preview WhatsApp/Telegram/dll. WAJIB URL absolut: ganti zero.vercel.app kalau domain Vercel-mu beda -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="zero CODEX">
<meta property="og:title" content="zero CODEX">
<meta property="og:description" content="Free script, ZeroTwo AI, open project, dan dokumentasi.">
<meta property="og:url" content="https://zero.vercel.app/">
<meta property="og:image" content="https://zero.vercel.app/thumbnail.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1117; --pink:#ff2d55; --magenta:#ff4d9d; --text:#eef1f8; --dim:#8b93a7; --glass:rgba(255,255,255,.08);
    --display:'Space Grotesk','Segoe UI',sans-serif; --mono:'JetBrains Mono','Fira Code',monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter','Segoe UI',system-ui,sans-serif; }

  /* ---- Layar awal: hero ala zero.my.id + sedikit bumbu ---- */
  .gate { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 16px;
    overflow: hidden; isolation: isolate; text-align: center; transition: opacity .35s ease;
    padding: env(safe-area-inset-top, 0px) 20px calc(28px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(70% 40% at 85% 8%, rgba(255,45,85,.28), transparent 70%),
      radial-gradient(60% 35% at 8% 75%, rgba(255,45,120,.15), transparent 70%),
      radial-gradient(1.2px 1.2px at 20% 30%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.4px 1.4px at 45% 62%, rgba(255,150,190,.5), transparent),
      radial-gradient(1px 1px at 88% 55%, rgba(255,255,255,.4), transparent),
      linear-gradient(#120a10, #0f1117 60%); }
  .gate[hidden] { display: none; }
  .gate.out { opacity: 0; }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .26; pointer-events: none; }

  .top { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 12px; padding: 14px 0 4px; }
  .ring { position: relative; overflow: hidden; flex: none; width: 44px; height: 44px; border-radius: 14px; padding: 2px; }
  .ring::before { content: ""; position: absolute; inset: -60%;
    background: conic-gradient(var(--pink), transparent 35%, #22e0ff 55%, transparent 80%, var(--pink)); animation: spin 3.5s linear infinite; }
  .logo { position: relative; width: 100%; height: 100%; border-radius: 12px; background: url("logo.png") center / cover no-repeat, #1b1f2e; }
  .wm { font: 700 1.15rem/1 var(--display); letter-spacing: .01em; } .wm b { color: var(--pink); }
  .ver { margin-left: auto; padding: 7px 11px; border: 1px solid var(--glass); border-radius: 999px;
    font: 500 .7rem/1 var(--mono); letter-spacing: .14em; color: var(--magenta); }

  .content { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 16px; animation: fadeUp .8s ease both; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--glass);
    font: 500 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--magenta); }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); animation: pulse 1.8s infinite; }
  .brand { margin: 0; font: italic 700 clamp(2.6rem, 12vw, 4.2rem)/1.05 var(--display); letter-spacing: -.01em; }
  .brand span { background: linear-gradient(115deg, var(--pink), var(--magenta), var(--pink)); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradShift 4s linear infinite; }
  .sub { margin: 0; font: 400 clamp(.82rem, 3.3vw, .95rem)/1.6 var(--mono); color: var(--dim); }

  /* Kartu Hiro 4:5 (class-nya sengaja bukan .stage supaya tidak bentrok dengan layar video) */
  .card { position: relative; width: min(100%, 320px); aspect-ratio: 4 / 5; border-radius: 22px; margin: 4px 0;
    box-shadow: 0 20px 60px -20px rgba(255,45,85,.55); }
  .halo { position: absolute; inset: -2px; z-index: 0; overflow: hidden; border-radius: 24px; }
  .halo::before { content: ""; position: absolute; inset: -60%;
    background: conic-gradient(var(--pink), transparent 30%, #22e0ff 50%, transparent 75%, var(--pink)); animation: spin 6s linear infinite; }
  .plate { position: absolute; inset: 0; z-index: 1; border-radius: 22px;
    background: radial-gradient(80% 60% at 50% 30%, rgba(255,45,85,.22), transparent), #150d14; }
  .hiro { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; border-radius: 22px; object-fit: cover;
    object-position: center top; opacity: 0; transition: opacity .6s ease; }
  .hiro.ready { opacity: 1; }
  .shade { position: absolute; inset: 0; z-index: 3; border-radius: 22px; pointer-events: none;
    background: linear-gradient(transparent 55%, rgba(10,4,8,.85)); }
  .card::after { content: ""; position: absolute; inset: 10px; z-index: 4; pointer-events: none; --c: rgba(255,77,157,.9); background-repeat: no-repeat;
    background:
      linear-gradient(var(--c), var(--c)) top left / 16px 2px, linear-gradient(var(--c), var(--c)) top left / 2px 16px,
      linear-gradient(var(--c), var(--c)) top right / 16px 2px, linear-gradient(var(--c), var(--c)) top right / 2px 16px,
      linear-gradient(var(--c), var(--c)) bottom left / 16px 2px, linear-gradient(var(--c), var(--c)) bottom left / 2px 16px,
      linear-gradient(var(--c), var(--c)) bottom right / 16px 2px, linear-gradient(var(--c), var(--c)) bottom right / 2px 16px;
    background-repeat: no-repeat; }
  .tagl, .tagr, .cap { position: absolute; z-index: 5; font: 500 .62rem/1 var(--mono); letter-spacing: .14em; color: rgba(255,255,255,.85); }
  .tagl { top: 22px; left: 24px; } .tagl::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px;
    border-radius: 50%; background: #22e0ff; box-shadow: 0 0 8px #22e0ff; }
  .tagr { top: 22px; right: 24px; color: var(--magenta); }
  .cap { left: 24px; bottom: 22px; }

  .actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .enter { appearance: none; cursor: pointer; position: relative; overflow: hidden; width: 100%; max-width: 520px; padding: 17px 24px;
    border: 0; border-radius: 999px; color: #fff; font: 600 1.05rem/1 var(--display);
    background: linear-gradient(160deg, var(--magenta), var(--pink) 65%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.2), 0 6px 22px rgba(255,45,85,.35);
    transition: transform .2s ease; }
  .enter::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38%; left: -60%; transform: skewX(-20deg);
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent); animation: sweep 3.4s ease-in-out infinite; }
  .enter:hover { transform: translateY(-2px); } .enter:active { transform: scale(.97); }
  .direct { appearance: none; cursor: pointer; width: 100%; max-width: 520px; padding: 14px; border-radius: 999px;
    border: 1px solid var(--glass); background: rgba(255,255,255,.06); color: var(--text); font: 500 .95rem/1 var(--display);
    transition: border-color .2s, color .2s; }
  .direct:hover { border-color: var(--magenta); color: var(--magenta); }
  .hint { margin: 0; font-size: .76rem; color: var(--dim); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,157,.5); } 70% { box-shadow: 0 0 0 10px rgba(255,77,157,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,157,0); } }
  @keyframes gradShift { to { background-position: 200% 50%; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sweep { from { left: -60%; } to { left: 130%; } }
  @media (prefers-reduced-motion: reduce) { .content, .pulse, .brand span, .ring::before, .halo::before, .enter::after { animation: none; } }

  /* ---- Layar video ---- */
  .stage { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity .35s ease; }
  .stage[hidden] { display: none; }
  .stage.out { opacity: 0; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bar { position: absolute; top: 0; left: 0; height: 3px; width: 0; background: var(--pink); }
  .ctrl { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px;
    bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .pill { appearance: none; border: 1px solid rgba(255,255,255,.28); cursor: pointer; padding: 11px 18px;
    border-radius: 999px; background: rgba(10,4,8,.55); color: var(--text); font: 600 .9rem/1 inherit;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  :focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
</style>
</head>
<body>

<main class="gate" id="gate">
  <canvas class="fx" id="fx"></canvas>
  <header class="top">
    <div class="ring"><div class="logo"></div></div><div class="wm">zero<b>.</b>ID</div><span class="ver">V3.0</span>
  </header>
  <div class="content">
    <span class="eyebrow"><i class="pulse"></i><span><span id="cnt">3100</span>+ fitur ZeroTwo AI</span></span>
    <h1 class="brand">zero <span>CODEX</span></h1>
    <p class="sub">Free Script &bull; ZeroTwo AI &bull; Open Project &bull; Documentation</p>
    <div class="card">
      <i class="halo"></i><i class="plate"></i>
      <video class="hiro" id="hiro" src="hiro.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-label="Hiro"></video>
      <i class="shade"></i>
      <span class="tagl">ZEROTWO.AI</span><span class="tagr">V3.0</span><span class="cap">ZEROTWO &times; HIRO</span>
    </div>
    <div class="actions">
      <button class="enter" id="enter" type="button">Putar intro</button>
      <button class="direct" id="direct" type="button">Langsung ke situs</button>
      <p class="hint">Sentuh untuk memutar intro dengan suara</p>
    </div>
    <noscript><a href="https://zero.my.id" style="color:#ff4d9d">Buka zero.my.id</a></noscript>
  </div>
</main>

<section class="stage" id="stage" hidden>
  <video id="vid" playsinline preload="auto" aria-label="Intro zero"></video>
  <div class="bar" id="bar"></div>
  <div class="ctrl">
    <button class="pill" id="mute" type="button">Suara nyala</button>
    <button class="pill" id="skip" type="button">Lewati intro</button>
  </div>
</section>

<script>
(function () {
  // ---------- PENGATURAN ----------
  var CONFIG = {
    destination: 'https://zero.my.id',
    videos: { mobile: 'intro_mobile.mp4', tablet: 'intro_tablet.mp4', desktop: 'intro_desktop.mp4' },
    oncePerSession: false   // true = intro hanya tampil sekali per sesi browser
  };

  // ---------- Penyimpanan aman (bisa gagal di mode privat) ----------
  function store(kind, key, val) {
    try {
      var s = kind === 'session' ? sessionStorage : localStorage;
      if (val === undefined) return s.getItem(key);
      s.setItem(key, val);
    } catch (e) { return null; }
  }

  if (CONFIG.oncePerSession && store('session', 'zero_intro_seen') === '1') {
    location.replace(CONFIG.destination);
    return;
  }

  var gate = document.getElementById('gate'), stage = document.getElementById('stage');
  var vid = document.getElementById('vid'), bar = document.getElementById('bar');
  var muteBtn = document.getElementById('mute'), leaving = false;

  // Pilihan suara tersimpan per pengunjung (localStorage di browser masing-masing)
  var muted = store('local', 'zero_muted') === '1';

  function pickVideo() {
    if (window.matchMedia('(max-width: 767px)').matches) return CONFIG.videos.mobile;
    if (window.matchMedia('(max-width: 1199px)').matches) return CONFIG.videos.tablet;
    return CONFIG.videos.desktop;
  }

  function paintMute() {
    vid.muted = muted;
    muteBtn.textContent = muted ? 'Suara mati' : 'Suara nyala';
    muteBtn.setAttribute('aria-pressed', String(muted));
  }

  function go() {
    if (leaving) return;
    leaving = true;
    store('session', 'zero_intro_seen', '1');
    gate.classList.add('out');
    stage.classList.add('out');
    setTimeout(function () { location.href = CONFIG.destination; }, 350);
  }

  document.getElementById('enter').addEventListener('click', function () {
    gate.hidden = true;
    stage.hidden = false;
    paintMute();
    vid.src = pickVideo();
    var p = vid.play();
    if (p && p.catch) {
      p.catch(function () {            // browser menolak suara -> coba tanpa suara
        muted = true; paintMute();
        vid.play().catch(go);
      });
    }
  });

  muteBtn.addEventListener('click', function () {
    muted = !muted;
    store('local', 'zero_muted', muted ? '1' : '0');
    paintMute();
  });

  document.getElementById('skip').addEventListener('click', go);
  document.getElementById('direct').addEventListener('click', go);
  vid.addEventListener('ended', go);
  vid.addEventListener('error', function () { setTimeout(go, 1200); });  // file video belum ada -> langsung ke situs
  vid.addEventListener('timeupdate', function () {
    if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100) + '%';
  });
})();
</script>
<script>
(function () {
  var gate = document.getElementById('gate'), cv = document.getElementById('fx'), hv = document.getElementById('hiro'),
      calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Video Hiro baru ditampilkan kalau file-nya benar-benar ada (kalau tidak, kartu tetap rapi)
  if (hv) {
    var ready = function () { hv.classList.add('ready'); };
    if (hv.readyState >= 2) ready(); else hv.addEventListener('loadeddata', ready);
    if (calm) hv.pause();
    document.getElementById('enter').addEventListener('click', function () { hv.pause(); });
  }

  if (calm) return;

  // Hujan biner redup di latar (berhenti saat intro diputar / tab disembunyikan)
  if (cv.getContext) {
    var ctx = cv.getContext('2d'), w, h, cols, drops, fs = 14, last = 0;
    var size = function () {
      var d = Math.min(window.devicePixelRatio || 1, 1.5);
      w = cv.clientWidth; h = cv.clientHeight; cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      cols = Math.ceil(w / (fs * 1.6)); drops = [];
      for (var i = 0; i < cols; i++) drops.push(Math.random() * h / fs);
    };
    size(); window.addEventListener('resize', size);
    (function frame(t) {
      if (!gate.hidden && !document.hidden && t - last > 55) {
        last = t;
        ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'source-over'; ctx.font = fs + 'px JetBrains Mono, monospace';
        for (var i = 0; i < cols; i++) {
          ctx.fillStyle = Math.random() > .97 ? 'rgba(255,170,200,.9)' : 'rgba(255,45,85,.6)';
          ctx.fillText(Math.random() > .5 ? '1' : '0', i * fs * 1.6, drops[i] * fs);
          if (drops[i] * fs > h && Math.random() > .975) drops[i] = 0;
          drops[i]++;
        }
      }
      requestAnimationFrame(frame);
    })(0);
  }

  // Hitung naik angka fitur
  var cn = document.getElementById('cnt'), t0 = null;
  if (cn) (function step(t) {
    t0 = t0 || t; var k = Math.min((t - t0) / 1600, 1);
    cn.textContent = Math.round(3100 * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(performance.now());
})();
</script>
</body>
</html>
